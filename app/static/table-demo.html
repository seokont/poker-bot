<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Демо: стол с BOT и «думает…»</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c111b;
        --card: #151d2e;
        --border: #2a3958;
        --text: #e9eef8;
        --muted: #8b98b3;
        --accent: #5ee1a0;
        --thinking: #f0c14d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 24px clamp(16px, 4vw, 48px) 48px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      .note {
        color: var(--muted);
        max-width: 720px;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 20px;
      }
      button {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        padding: 10px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
      }
      button.primary {
        background: var(--accent);
        color: #062016;
        border-color: transparent;
      }
      .seats {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 14px;
        max-width: 900px;
      }
      .poker-bot-seat {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
        background: var(--card);
      }
      .poker-bot-seat--active {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px rgba(94, 225, 160, 0.35);
      }
      .poker-bot-seat__head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .poker-bot-badge {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        background: var(--accent);
        color: #062016;
        padding: 3px 6px;
        border-radius: 6px;
      }
      .poker-bot-seat__name {
        font-weight: 700;
      }
      .poker-bot-thinking {
        margin-top: 10px;
        font-size: 13px;
        color: var(--muted);
        min-height: 1.4em;
        opacity: 0;
        transition: opacity 0.2s;
      }
      .poker-bot-thinking--visible {
        opacity: 1;
        color: var(--thinking);
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <h1>Демо: BOT за столом и «думает…»</h1>
    <p class="note">
      Это <strong>только UI-демо</strong>. В продакшене снимок стола приходит с <strong>Game Engine</strong> (WebSocket/REST). Bot-server
      вызывается <strong>сервером</strong> движка, не браузером игрока. Бот никогда не должен выглядеть как скрытый человек — всегда бейдж
      <code>BOT</code>.
    </p>
    <div class="toolbar">
      <button type="button" class="primary" id="btn-human-turn">Ход человека</button>
      <button type="button" id="btn-bot-turn">Ход бота (показать «думает»)</button>
      <button type="button" id="btn-reset">Сброс</button>
    </div>
    <div class="seats" id="seats"></div>

    <script src="/static/js/bot-table-ui.js"></script>
    <script>
      (function () {
        var human = { id: "p1", displayName: "Alice", isBot: false };
        var bot = { id: "b1", displayName: "BOT Grinder", isBot: true };

        var table = {
          currentActorId: human.id,
          handId: "demo-hand",
        };

        function render() {
          var root = document.getElementById("seats");
          root.innerHTML =
            PokerBotTableUI.renderSeatCardHtml(human, table) + PokerBotTableUI.renderSeatCardHtml(bot, table);
        }

        document.getElementById("btn-human-turn").onclick = function () {
          table.currentActorId = human.id;
          render();
        };
        document.getElementById("btn-bot-turn").onclick = function () {
          table.currentActorId = bot.id;
          render();
        };
        document.getElementById("btn-reset").onclick = function () {
          table.currentActorId = human.id;
          render();
        };

        render();
      })();
    </script>
  </body>
</html>
