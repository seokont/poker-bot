<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bot Dashboard Login</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --card: #141b2f;
        --card-2: #19223a;
        --text: #e8edf7;
        --muted: #96a3bb;
        --accent: #49d391;
        --danger: #ff6575;
        --border: #26324d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top left, #1a2a4c 0, var(--bg) 42%);
        color: var(--text);
        padding: 24px;
      }

      .card {
        width: min(420px, 100%);
        background: rgba(20, 27, 47, 0.95);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.04em;
      }

      .subtitle {
        margin: 10px 0 24px;
        color: var(--muted);
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 7px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
      }

      input {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--card-2);
        color: var(--text);
        outline: none;
      }

      input:focus {
        border-color: var(--accent);
      }

      button {
        margin-top: 8px;
        border: 0;
        border-radius: 12px;
        padding: 12px 14px;
        color: #06130d;
        background: var(--accent);
        font-weight: 800;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      .message {
        margin-top: 14px;
        color: var(--danger);
        font-size: 14px;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Bot Dashboard</h1>
      <p class="subtitle">Sign in to manage BOT profiles, table assignment, and runtime state.</p>

      <form id="login-form">
        <label>
          Username
          <input name="username" autocomplete="username" required />
        </label>
        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Sign In</button>
      </form>
      <div id="message" class="message"></div>
    </div>

    <script>
      const form = document.querySelector("#login-form");
      const message = document.querySelector("#message");

      const showError = (text) => {
        message.textContent = text;
      };

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";
        const data = Object.fromEntries(new FormData(form).entries());
        const button = form.querySelector("button");
        button.disabled = true;
        try {
          const response = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({
              username: data.username.trim(),
              password: data.password,
            }),
          });
          if (!response.ok) {
            const text = await response.text();
            throw new Error(text || `HTTP ${response.status}`);
          }
          window.location.href = "/dashboard";
        } catch (error) {
          showError("Invalid username or password.");
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
